[platformio]
default_envs = master, slave

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
upload_speed = 460800
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D CAN_TX_GPIO=25
    -D CAN_RX_GPIO=26
    -D LINK_TX_GPIO=17
    -D LINK_RX_GPIO=16
    -D LINK_BAUD=115200

[env:master]
build_flags = ${env.build_flags} -D ADAPTER_MASTER=1 -D PC_BAUD=57600

[env:slave]
build_flags = ${env.build_flags} -D ADAPTER_MASTER=0
